# Her main push'unda (veya elle) yeni sürüm: Android APK + Windows kurucusu + macOS
# derlenir ve tek bir GitHub Release'te yayınlanır. Uygulamalar güncellemeyi buradan alır.
# Sürüm: package.json'daki ana.ara + çalışma numarası (ör. 1.0.37).
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        name: Sürüm numarası
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Taslak release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev" ]; then notes=$(git log "$prev"..HEAD --pretty='- %s' --no-merges); else notes=$(git log -1 --pretty='- %s'); fi
          gh release create "v$V" --draft --target "$GITHUB_SHA" --title "Vision $V" --notes "$notes"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Arayüz bağımlılıkları (hls.js, mpegts.js)
        run: npm ci --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0"
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 gizli değişkeni yok — güncellemeler aynı anahtarla imzalanmalı"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/vision.jks"
      - name: APK derle
        working-directory: android
        env:
          VISION_VERSION: ${{ needs.prepare.outputs.version }}
          VISION_KEYSTORE: ${{ runner.temp }}/vision.jks
          VISION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VISION_KEY_ALIAS: vision
          VISION_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Vision-$V.apk"
          gh release upload "v$V" "Vision-$V.apk" --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm version "$env:V" --no-git-tag-version --allow-same-version
      - name: Windows kurucusu derle ve yükle
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm version "$V" --no-git-tag-version --allow-same-version
      - name: macOS derle ve yükle
        run: npx electron-builder --mac dmg zip --arm64 --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [prepare, android, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Release'i yayınla (uygulamalar güncellemeyi görsün)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$V" --repo "$GITHUB_REPOSITORY" --draft=false --latest
